name: CI

# Lint, typecheck, unit tests (including the planted-case accuracy and
# fairness checks), then the Playwright end-to-end suite against a
# production build, including axe accessibility checks that fail on serious
# or critical violations. No deploy: deploys are run manually with fly deploy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests, accuracy and fairness
        run: npm test
      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end and accessibility (axe)
        run: npm run test:e2e
      - name: Keep the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
